<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Vault Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-top: 0.5rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f0f0 60%, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: #888;
            font-size: 0.95rem;
            margin-top: 0.4rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 1.8rem 1.2rem 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #1185fe;
            box-shadow: 0 8px 30px rgba(17, 133, 254, 0.08);
        }
        .card:active {
            transform: scale(0.97);
        }
        .card-icon {
            font-size: 2.4rem;
            margin-bottom: 0.8rem;
            background: rgba(255,255,255,0.04);
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid #2a2a2a;
            overflow: hidden;
        }
        .card-icon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            letter-spacing: -0.01em;
        }
        .card p {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
            margin-bottom: 1rem;
            flex-grow: 1;
        }
        .card-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            font-family: inherit;
            border: none;
            background: #1185fe;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            box-shadow: 0 4px 15px rgba(17, 133, 254, 0.25);
            text-decoration: none;
        }
        .card-btn:hover {
            background: #0a6fd9;
            transform: translateY(-2px);
        }
        .card-btn:active {
            transform: scale(0.95);
        }
        .card-btn i {
            font-size: 0.7rem;
        }
        .card-bsky .card-icon { color: #1185fe; }
        .card-fb .card-icon { color: #1877f2; }
        .card-threads .card-icon { color: #fff; }
        .card-ig .card-icon { color: #e4405f; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body { padding: 0.8rem; }
            .container { max-width: 100%; }
            .header h1 { font-size: 1.4rem; }
            .header p { font-size: 0.8rem; }
            .grid { gap: 0.8rem; }
            .card { padding: 1.2rem 0.8rem 1rem; border-radius: 12px; }
            .card-icon { width: 48px; height: 48px; font-size: 1.6rem; }
            .card-icon img { width: 28px; height: 28px; }
            .card h3 { font-size: 0.9rem; }
            .card p { font-size: 0.7rem; }
            .card-btn { font-size: 0.7rem; padding: 0.4rem 0.9rem; }
        }
        @media (max-width: 400px) {
            .grid { gap: 0.6rem; }
            .card { padding: 1rem 0.6rem 0.8rem; border-radius: 10px; }
            .card-icon { width: 40px; height: 40px; font-size: 1.3rem; }
            .card-icon img { width: 22px; height: 22px; }
            .card h3 { font-size: 0.8rem; }
            .card p { font-size: 0.65rem; }
            .card-btn { font-size: 0.6rem; padding: 0.3rem 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AI Vault Hub</h1>
            <p>Choose your destination</p>
        </div>
        <div class="grid">
            <!-- Bluesky -->
            <a href="https://smartbluesky.vercel.app" target="_blank" rel="noopener noreferrer" class="card card-bsky">
                <div class="card-icon">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Bluesky_Logo.svg" alt="Bluesky" />
                </div>
                <h3>Bluesky</h3>
                <p>Fetch, vault, and post to Bluesky.</p>
                <span class="card-btn">Launch <i class="fas fa-arrow-right"></i></span>
            </a>
            <!-- Facebook -->
            <a href="https://smartfacebook.vercel.app" target="_blank" rel="noopener noreferrer" class="card card-fb">
                <div class="card-icon"><i class="fab fa-facebook-f"></i></div>
                <h3>Facebook</h3>
                <p>Fetch from Bluesky, post to Facebook.</p>
                <span class="card-btn">Launch <i class="fas fa-arrow-right"></i></span>
            </a>
            <!-- Threads -->
            <a href="https://smarthreads.vercel.app" target="_blank" rel="noopener noreferrer" class="card card-threads">
                <div class="card-icon"><i class="fas fa-comment-dots"></i></div>
                <h3>Threads</h3>
                <p>Fetch from Bluesky, post to Threads.</p>
                <span class="card-btn">Launch <i class="fas fa-arrow-right"></i></span>
            </a>
            <!-- Instagram -->
            <a href="https://smartinstagram.vercel.app" target="_blank" rel="noopener noreferrer" class="card card-ig">
                <div class="card-icon"><i class="fab fa-instagram"></i></div>
                <h3>Instagram</h3>
                <p>Fetch from Bluesky, post to Instagram.</p>
                <span class="card-btn">Launch <i class="fas fa-arrow-right"></i></span>
            </a>
        </div>
    </div>
</body>
</html>
